<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ToDo{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f0;
      color: #1a1a18;
      min-height: 100vh;
    }

    nav {
      background: #1a1a18;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
    }

    nav .brand {
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color .15s;
    }

    nav a:hover { color: #fff; }

    .container {
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    p {
      color: #555;
      line-height: 1.7;
      font-size: 1rem;
    }

    .badge {
      display: inline-block;
      background: #e8e8e2;
      color: #555;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'tasks:index' %}" class="brand">✓ ToDo</a>
    <a href="{% url 'tasks:index' %}">Головна</a>
    <a href="{% url 'tasks:about' %}">Про проєкт</a>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
